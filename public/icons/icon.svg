<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <linearGradient id="plateGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
    <linearGradient id="spongeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#facc15" />
      <stop offset="100%" stop-color="#eab308" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-opacity="0.25" />
    </filter>
  </defs>
  
  <!-- Rounded Background -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  
  <!-- Floating Bubbles -->
  <circle cx="120" cy="140" r="28" fill="#ffffff" opacity="0.3" />
  <circle cx="110" cy="130" r="8" fill="#ffffff" opacity="0.7" />
  <circle cx="410" cy="180" r="36" fill="#ffffff" opacity="0.25" />
  <circle cx="398" cy="168" r="10" fill="#ffffff" opacity="0.6" />
  <circle cx="370" cy="380" r="24" fill="#ffffff" opacity="0.3" />
  <circle cx="140" cy="390" r="18" fill="#ffffff" opacity="0.2" />

  <!-- Dish Plate -->
  <circle cx="256" cy="256" r="160" fill="url(#plateGrad)" filter="url(#shadow)" />
  <circle cx="256" cy="256" r="125" fill="#f8fafc" stroke="#cbd5e1" stroke-width="4" stroke-dasharray="8 6" opacity="0.8" />
  <circle cx="256" cy="256" r="95" fill="#ffffff" />

  <!-- Sponge -->
  <g transform="translate(290, 260) rotate(-15)" filter="url(#shadow)">
    <!-- Scrubbing layer -->
    <rect x="-10" y="28" width="100" height="22" rx="8" fill="#10b981" />
    <!-- Foam layer -->
    <rect x="-10" y="-15" width="100" height="46" rx="10" fill="url(#spongeGrad)" />
    <!-- Soap suds on sponge -->
    <circle cx="15" cy="-20" r="14" fill="#ffffff" opacity="0.9" />
    <circle cx="40" cy="-24" r="18" fill="#ffffff" opacity="0.95" />
    <circle cx="68" cy="-18" r="15" fill="#ffffff" opacity="0.9" />
  </g>

  <!-- Sparkles -->
  <path d="M 180 180 Q 180 205 160 205 Q 180 205 180 230 Q 180 205 200 205 Q 180 205 180 180 Z" fill="#38bdf8" />
  <circle cx="180" cy="205" r="4" fill="#ffffff" />

  <path d="M 230 140 Q 230 155 215 155 Q 230 155 230 170 Q 230 155 245 155 Q 230 155 230 140 Z" fill="#facc15" />

  <path d="M 170 290 Q 170 302 158 302 Q 170 302 170 314 Q 170 302 182 302 Q 170 302 170 290 Z" fill="#38bdf8" />
</svg>
