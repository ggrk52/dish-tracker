<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Технические работы — Чистая Тарелка PRO</title>
  <link rel="icon" type="image/svg+xml" href="icons/icon.svg">
  <meta name="theme-color" content="#0b0f17">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <style>
    :root {
      --bg: #0b0f17;
      --bg-card: rgba(18, 24, 38, 0.82);
      --border: rgba(255, 255, 255, 0.08);
      --border-strong: rgba(255, 255, 255, 0.14);
      --ink: #f1f5f9;
      --ink-muted: #94a3b8;
      --amber: #f59e0b;
      --teal: #14b8a6;
      --emerald: #10b981;
      --radius: 20px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: var(--bg);
      color: var(--ink);
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: calc(env(safe-area-inset-top, 20px) + 16px) 16px calc(env(safe-area-inset-bottom, 20px) + 16px);
      position: relative;
      overflow-x: hidden;
    }

    /* Ambient Glow Behind Card */
    body::before {
      content: "";
      position: fixed;
      top: 30%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 320px;
      height: 320px;
      background: radial-gradient(circle, rgba(245, 158, 11, 0.18) 0%, rgba(20, 184, 166, 0.12) 45%, transparent 70%);
      filter: blur(48px);
      pointer-events: none;
      z-index: 0;
      animation: ambientPulse 6s ease-in-out infinite alternate;
    }

    @keyframes ambientPulse {
      0% { transform: translate(-50%, -50%) scale(0.92); opacity: 0.7; }
      100% { transform: translate(-50%, -50%) scale(1.15); opacity: 1; }
    }

    .maintenance-container {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 420px;
      background: var(--bg-card);
      border: 1px solid var(--border-strong);
      border-radius: var(--radius);
      padding: 32px 24px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(28px);
      -webkit-backdrop-filter: blur(28px);
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 20px;
    }

    /* Animated Icon */
    .icon-wrap {
      position: relative;
      width: 90px;
      height: 90px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      background: rgba(245, 158, 11, 0.1);
      border: 2px solid rgba(245, 158, 11, 0.35);
      box-shadow: 0 0 32px rgba(245, 158, 11, 0.25);
    }

    .icon-main {
      font-size: 2.8rem;
      line-height: 1;
      animation: toolWiggle 3.2s ease-in-out infinite;
    }

    @keyframes toolWiggle {
      0%, 100% { transform: rotate(0deg) scale(1); }
      20% { transform: rotate(-14deg) scale(1.05); }
      40% { transform: rotate(10deg) scale(1.05); }
      60% { transform: rotate(-6deg); }
      80% { transform: rotate(4deg); }
    }

    .bubble-badge {
      position: absolute;
      bottom: -4px;
      right: -4px;
      font-size: 1.4rem;
      background: rgba(20, 184, 166, 0.2);
      border: 1.5px solid rgba(20, 184, 166, 0.5);
      border-radius: 50%;
      width: 34px;
      height: 34px;
      display: flex;
      align-items: center;
      justify-content: center;
      animation: floatBubble 2.5s ease-in-out infinite alternate;
    }

    @keyframes floatBubble {
      0% { transform: translateY(0); }
      100% { transform: translateY(-4px); }
    }

    /* Titles */
    .title-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .title {
      font-size: 1.45rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      color: #fff;
    }

    .subtitle {
      font-size: 0.88rem;
      color: var(--amber);
      font-weight: 600;
    }

    /* Info Highlights */
    .info-list {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 10px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px;
      text-align: left;
    }

    .info-item {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      font-size: 0.82rem;
      color: var(--ink-muted);
      line-height: 1.4;
    }

    .info-icon {
      font-size: 1.1rem;
      line-height: 1;
      flex-shrink: 0;
      margin-top: 1px;
    }

    .info-item strong {
      color: var(--ink);
    }

    /* Live Checker Status */
    .live-status-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 14px;
      border-radius: 9999px;
      background: rgba(245, 158, 11, 0.12);
      border: 1px solid rgba(245, 158, 11, 0.3);
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 0.74rem;
      color: var(--amber);
      font-weight: 600;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--amber);
      box-shadow: 0 0 8px var(--amber);
      animation: pulseDot 1.4s infinite ease-in-out;
    }

    @keyframes pulseDot {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.85); }
    }

    /* Action Buttons */
    .btn-check {
      width: 100%;
      min-height: 46px;
      border: 1px solid rgba(255, 255, 255, 0.16);
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.1), rgba(255, 255, 255, 0.03));
      border-radius: 12px;
      color: #fff;
      font-family: inherit;
      font-size: 0.9rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .btn-check:active {
      transform: scale(0.96);
      background: rgba(255, 255, 255, 0.15);
    }

    .footer-note {
      font-size: 0.72rem;
      color: rgba(148, 163, 184, 0.65);
    }
  </style>
</head>
<body>
  <main class="maintenance-container">
    <div class="icon-wrap">
      <span class="icon-main">🛠️</span>
      <span class="bubble-badge">🧼</span>
    </div>

    <div class="title-group">
      <h1 class="title">Ведутся техработы</h1>
      <p class="subtitle">Чистая Тарелка PRO обновляется ✨</p>
    </div>

    <div class="info-list">
      <div class="info-item">
        <span class="info-icon">🛡️</span>
        <div><strong>Данные в безопасности</strong><br>История дежурств, статистика семьи и баллы сохранены.</div>
      </div>
      <div class="info-item">
        <span class="info-icon">⚙️</span>
        <div><strong>Установка обновлений</strong><br>Выполняется обновление серверных компонентов.</div>
      </div>
    </div>

    <div class="live-status-pill" id="status-pill">
      <span class="status-dot" id="status-dot"></span>
      <span id="status-text">Ожидание завершения работ...</span>
    </div>

    <button type="button" class="btn-check" id="btn-check">
      <span>🔄</span>
      <span>Проверить готовность</span>
    </button>

    <div class="footer-note" id="timer-note">
      Автоматическая проверка каждые 5 сек.
    </div>
  </main>

  <script>
    const statusText = document.getElementById('status-text');
    const statusDot = document.getElementById('status-dot');
    const btnCheck = document.getElementById('btn-check');

    async function checkStatus() {
      statusText.textContent = 'Проверка сервера...';
      try {
        const res = await fetch('/api/state?_t=' + Date.now(), { cache: 'no-store' });
        if (res.status === 200) {
          const data = await res.json().catch(() => ({}));
          if (!data.maintenance) {
            statusDot.style.background = '#10b981';
            statusDot.style.boxShadow = '0 0 10px #10b981';
            statusText.textContent = 'Сервер готов! Вход... 🚀';
            setTimeout(() => {
              window.location.href = './index.html?_=' + Date.now();
            }, 600);
            return;
          }
        }
        statusText.textContent = 'Техработы продолжаются ⏳';
      } catch (err) {
        statusText.textContent = 'Сервер перезагружается...';
      }
    }

    btnCheck.addEventListener('click', checkStatus);
    setInterval(checkStatus, 5000);
  </script>
</body>
</html>
